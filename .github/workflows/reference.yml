name: Verify MuJoCo reference adapter
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-reference.txt
      - run: pip install -r scripts/requirements-reference.txt
      - run: python scripts/test_reference_backend.py
      - run: python scripts/benchmark_backend_mujoco.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: coach_sim/package-lock.json
      - run: npm ci --prefix coach_sim
      - run: node scripts/benchmark-backend-rapier.mjs
      - run: node scripts/compare-backends.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: reference-engine-comparison
          path: |
            evidence/backend-*-traces.json.gz
            evidence/backend-comparison.json
            evidence/REFERENCE_BACKEND.md
